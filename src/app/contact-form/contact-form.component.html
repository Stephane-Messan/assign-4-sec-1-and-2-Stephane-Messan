<div class="card p-4 shadow-sm">
  <h2 class="text-center">Add Contact</h2>
  <div class="form-group">
    <label>First Name</label>
    <input type="text" class="form-control" [(ngModel)]="contact.firstName" required>
  </div>

  <div class="form">
    <label class="label">Last Name</label>
    <input type="text" class="form-control" [(ngModel)]="contact.lastName" required>
  </div>

  <div class="form">
    <label>Phone Number</label>
    <input type="text" class="form-control" [(ngModel)]="contact.phone" required>
  </div>

  <div class="d-flex justify-content-between mt-3">
    <button  class="btn btn-primary" (click)="addContact()">Add</button>
    <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
  </div>
</div>
