<div class="card" style="width: 18rem;"></div>
<div class="contact-item d-flex justify-content-between align-items-end p-3 border-bottom">
  <div class="contact-details">
    <h5>{{ contact.name }}</h5>
    <p class="mb-0">{{ contact.phone }}</p>
  </div>
  <div class="contact-actions">
    <button class="btn btn-primary btn-sm ml-2">Edit</button>
    <button class="btn btn-danger btn-sm ml-2">Delete</button>
  </div>
</div>
